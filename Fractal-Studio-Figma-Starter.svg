        <text x="1196" y="145" fill="#e8e9ed" font-family="Calibri, Arial, sans-serif" font-size="12">Iterations</text>
        <text x="1408" y="145" text-anchor="end" fill="#b9f477" font-family="Calibri, Arial, sans-serif" font-size="12" font-weight="700">300</text>
        <path d="M1196 167H1408" stroke="#3a3d46" stroke-width="3" stroke-linecap="round"/>
        <path d="M1196 167H1261" stroke="#b9f477" stroke-width="3" stroke-linecap="round"/>
        <circle cx="1261" cy="167" r="6" fill="#b9f477" stroke="#111217" stroke-width="2"/>
