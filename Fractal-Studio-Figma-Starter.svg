        <ellipse cx="824" cy="501" rx="58" ry="44" fill="#090a0d" stroke="#5b8cff" stroke-width="4"/>
        <path d="M700 343 C681 312 687 284 706 271 C727 257 748 276 740 297 C734 313 717 315 708 304" fill="none" stroke="#ffc857" stroke-width="5" stroke-linecap="round"/>
        <path d="M700 641 C681 672 687 700 706 713 C727 727 748 708 740 687 C734 671 717 669 708 680" fill="none" stroke="#62d9db" stroke-width="5" stroke-linecap="round"/>
