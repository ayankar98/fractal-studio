<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Fractal Studio — editable desktop UI starter</title>
  <desc>1440 by 900 desktop app mockup. Import into Figma, then ungroup to edit individual interface elements.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101116"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b9f477"/><stop offset=".52" stop-color="#6bc7c9"/><stop offset="1" stop-color="#a77cff"/></linearGradient>
    <linearGradient id="fractalColor" x1=".12" y1=".9" x2=".9" y2=".1"><stop stop-color="#ff6b35"/><stop offset=".24" stop-color="#f9c74f"/><stop offset=".46" stop-color="#a4e36f"/><stop offset=".68" stop-color="#4cc9d0"/><stop offset=".84" stop-color="#6378ff"/><stop offset="1" stop-color="#e779ff"/></linearGradient>
    <radialGradient id="canvasGlow"><stop stop-color="#262031"/><stop offset=".66" stop-color="#12141c"/><stop offset="1" stop-color="#0c0d11"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#090a0d" offset=".55"/><stop stop-color="#090a0d" offset=".7"/><stop stop-color="#f9c74f" offset=".705"/><stop stop-color="#ff6b35" offset=".735"/><stop stop-color="#6bc7c9" offset=".76"/><stop stop-color="#657cff" offset=".785"/><stop stop-color="#12131a" offset=".82"/><stop stop-color="#090a0d" offset="1"/></radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g id="app-frame">
    <rect width="1440" height="900" rx="16" fill="url(#background)"/>
    <rect x="1" y="1" width="1438" height="898" rx="15" fill="none" stroke="#2a2c33"/>

    <g id="top-navigation">
      <rect x="1" y="1" width="1438" height="67" rx="15" fill="#111217"/>
      <path d="M1 67H1439" stroke="#292b32"/>
      <circle cx="37" cy="34" r="17" fill="#17191e" stroke="#a7e66e" stroke-opacity=".8"/>
      <text x="37" y="40" text-anchor="middle" fill="#c7fa8a" font-family="Calibri, Arial, sans-serif" font-size="18" font-weight="700">F</text>
      <text x="66" y="39" fill="#f4f5f6" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">FRACTAL</text>
      <text x="133" y="39" fill="#8e929c" font-family="Calibri, Arial, sans-serif" font-size="15" letter-spacing="1.4">STUDIO</text>
      <circle cx="574" cy="34" r="4" fill="#b7f278"/>
      <text x="589" y="38" fill="#b6bac5" font-family="Calibri, Arial, sans-serif" font-size="10" letter-spacing="1.3">GENERATIVE CANVAS</text>
      <text x="725" y="38" fill="#555963" font-family="Calibri, Arial, sans-serif" font-size="11">/</text>
      <text x="741" y="38" fill="#c7c9d0" font-family="Calibri, Arial, sans-serif" font-size="10" letter-spacing="1.3">MANDELBROT 01</text>
      <rect x="1282" y="15" width="132" height="38" rx="7" fill="#b9f477"/>
      <text x="1348" y="39" text-anchor="middle" fill="#171a12" font-family="Calibri, Arial, sans-serif" font-size="12" font-weight="700">Export artwork ↗</text>
    </g>

