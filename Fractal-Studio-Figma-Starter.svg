        <text x="1196" y="477" fill="#e8e9ed" font-family="Calibri, Arial, sans-serif" font-size="12">Color frequency</text><text x="1408" y="477" text-anchor="end" fill="#b9f477" font-family="Calibri, Arial, sans-serif" font-size="11">1.00×</text>
        <path d="M1196 493H1408" stroke="#3a3d46" stroke-width="3" stroke-linecap="round"/><path d="M1196 493H1266" stroke="#b9f477" stroke-width="3" stroke-linecap="round"/><circle cx="1266" cy="493" r="5" fill="#b9f477"/>
