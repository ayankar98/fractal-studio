      <rect x="24" y="371" width="174" height="42" rx="6" fill="#191b21" stroke="#3a3d46"/>
      <text x="38" y="396" fill="#e4e5e9" font-family="Calibri, Arial, sans-serif" font-size="12">Full set overview</text>
      <path d="m181 388 4 4 4-4" fill="none" stroke="#9095a0" stroke-width="1.5"/>
      <rect x="24" y="431" width="174" height="42" rx="6" fill="#15171c" stroke="#343740"/>
      <text x="39" y="457" fill="#d4d6dc" font-family="Calibri, Arial, sans-serif" font-size="12">↺  Reset composition</text>
      <text x="25" y="505" fill="#8f939e" font-family="Calibri, Arial, sans-serif" font-size="11" letter-spacing=".4">SCROLL</text>
      <text x="78" y="505" fill="#c2c5cd" font-family="Calibri, Arial, sans-serif" font-size="11">Zoom to cursor</text>
      <text x="25" y="533" fill="#8f939e" font-family="Calibri, Arial, sans-serif" font-size="11" letter-spacing=".4">DRAG</text>
      <text x="78" y="533" fill="#c2c5cd" font-family="Calibri, Arial, sans-serif" font-size="11">Pan canvas</text>
