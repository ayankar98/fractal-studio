      <circle cx="40" cy="172" r="3" fill="#b9f477"/>
      <text x="52" y="176" fill="#f0f1f3" font-family="Calibri, Arial, sans-serif" font-size="13">Mandelbrot / Multibrot</text>
      <path d="m181 169 4 4 4-4" fill="none" stroke="#9095a0" stroke-width="1.5"/>
      <rect x="24" y="203" width="174" height="42" rx="6" fill="#15171c" stroke="#292b32"/>
