        <path d="M1196 591H1408" stroke="#3a3d46" stroke-width="3" stroke-linecap="round"/><path d="M1196 591H1302" stroke="#b9f477" stroke-width="3" stroke-linecap="round"/><circle cx="1302" cy="591" r="5" fill="#b9f477"/>
