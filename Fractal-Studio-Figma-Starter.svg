        <rect x="1196" y="733" width="142" height="30" rx="5" fill="#17191e" stroke="#363941"/>
        <text x="1267" y="752" text-anchor="middle" fill="#d2d4db" font-family="Calibri, Arial, sans-serif" font-size="10">Reset color controls</text>
