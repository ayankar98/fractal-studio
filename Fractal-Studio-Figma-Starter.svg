        <text x="1196" y="878" fill="#747985" font-family="Calibri, Arial, sans-serif" font-size="9" letter-spacing="1">CENTER X</text><text x="1408" y="878" text-anchor="end" fill="#c7c9d0" font-family="Consolas, monospace" font-size="9">-0.500000</text>
      </g>
