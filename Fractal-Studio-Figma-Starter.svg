        <text x="1196" y="673" fill="#e8e9ed" font-family="Calibri, Arial, sans-serif" font-size="12">Contour overlay</text><text x="1408" y="673" text-anchor="end" fill="#b9f477" font-family="Calibri, Arial, sans-serif" font-size="11">0%</text>
        <path d="M1196 689H1408" stroke="#3a3d46" stroke-width="3" stroke-linecap="round"/><circle cx="1196" cy="689" r="5" fill="#b9f477"/>
